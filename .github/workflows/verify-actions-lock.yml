name: Verify actions lock

# Verifies the repository's GitHub Actions dependency lockfile. The check
# fails when .github/workflows/actions.lock is out of sync with the
# workflows or a locked pin no longer verifies upstream. A repository calls
# this workflow at a pinned commit of cdxgen/.github, since a lockfile does
# not cover reusable workflow calls, and makes the check required. See
# https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles
on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/**
      - '**/action.y*ml'
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - '**/action.y*ml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the gh-actions-lock extension
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the lockfile
        run: gh actions-lock --verify
