name: Project sync

# Reusable workflow. A repository calls it from an issues and
# pull_request_target workflow, see workflow-templates/project-sync.yml.
#
# The job never checks out the caller's code. It fetches this repository's
# project/ folder and runs sync.mjs, which only reads the event payload and
# talks to the GitHub GraphQL API. That is what makes pull_request_target safe
# here, see
# https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
on:
  workflow_call:
    inputs:
      project-number:
        description: >-
          Number of the organization project to update. Used only when the
          PROJECT_NUMBER secret is not passed.
        type: string
        default: ""
      ref:
        description: Ref of cdxgen/.github that holds the scripts. Pin a commit to freeze behavior.
        type: string
        default: main
      schema-repository:
        description: >-
          Repository, such as owasp-dep-scan/.github, whose project/schema.json
          replaces the schema bundled here. Leave empty to use this one.
        type: string
        default: ""
    secrets:
      PROJECT_TOKEN:
        description: Token with write access to organization projects
        required: false
      PROJECT_NUMBER:
        description: >-
          Number of the organization project to update. The organizations keep
          it as a secret, and a caller cannot pass a secret through an input.
        required: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch the sync scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cdxgen/.github
          ref: ${{ inputs.ref }}
          sparse-checkout: project
          persist-credentials: false

      - name: Fetch the organization's schema
        if: ${{ inputs.schema-repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.schema-repository }}
          path: schema
          sparse-checkout: project/schema.json
          persist-credentials: false

      - name: Update the project
        env:
          SCHEMA_REPOSITORY: ${{ inputs.schema-repository }}
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ secrets.PROJECT_NUMBER || inputs.project-number }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PROJECT_TOKEN is not available to this repository. Skipping."
            exit 0
          fi
          if [ -n "$SCHEMA_REPOSITORY" ]; then
            export PROJECT_SCHEMA="$GITHUB_WORKSPACE/schema/project/schema.json"
          fi
          node project/sync.mjs
