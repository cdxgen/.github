name: Verify actions lock

# Verifies the repository's GitHub Actions dependency lockfile on pull
# requests and pushes that touch workflows or composite actions. Run
# gh actions-lock in the repository checkout to write
# .github/workflows/actions.lock first, and make this check required. See
# https://github.com/cdxgen/.github/tree/main/workflow-templates
on:
  pull_request:
    paths:
      - .github/workflows/**
      - '**/action.y*ml'
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - '**/action.y*ml'

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    # Replace main with a commit SHA of cdxgen/.github. A lockfile does not
    # cover reusable workflow calls, so the pin has to carry the protection.
    uses: cdxgen/.github/.github/workflows/verify-actions-lock.yml@main
